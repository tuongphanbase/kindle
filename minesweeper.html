<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kindle Minesweeper</title>
<link rel="stylesheet" href="style.css">
<style>
  .ms { border-collapse: collapse; margin: 0 auto; border: 3px solid #000; }
  .ms td { padding: 0; text-align: center; vertical-align: middle; font-weight: bold; border: 1px solid #000; }
  .ms .h { background: #aaa; }
  .ms .o { background: #fff; }
  .ms .f { background: #000; color: #fff; }
  .ms .x { background: #000; color: #fff; }
  .ms .w { background: #fff; text-decoration: line-through; }
</style>
</head>
<body>
<div class="top"><a href="index.html">&larr; Home</a><span class="title">Minesweeper</span></div>
<div class="controls" id="levels">
  <button data-v="e">Easy 9&times;9</button><button data-v="m">Medium 12&times;12</button><button data-v="h">Hard 16&times;16</button>
</div>
<div id="status" class="status"></div>
<div class="controls" id="tools">
  Tap to: <button data-v="d">Dig</button><button data-v="f">Flag</button>
</div>
<div id="board"></div>
<div class="controls">
  <button id="newBtn">New Game</button>
</div>
<p class="help">Choose <b>Dig</b> to open a square or <b>Flag</b> to mark a mine (F). A number shows how many mines touch
that square. Tap an opened number whose mines are all flagged to open its other neighbours. The first dig is always safe.
Your game is saved automatically.</p>
<script src="common.js"></script>
<script>
(function () {
  var KEY = 'kg-mines';
  var LEVELS = { e: { w: 9, h: 9, n: 10 }, m: { w: 12, h: 12, n: 24 }, h: { w: 16, h: 16, n: 40 } };
  var boardEl = KG.$('board'), statusEl = KG.$('status');
  var saved = KG.load(KEY) || {};
  var level = saved.level || 'e', tool = 'd', g = saved.g || null;

  function newGame() {
    var L = LEVELS[level], cells = [];
    for (var i = 0; i < L.w * L.h; i++) cells.push({ m: 0, o: 0, f: 0, n: 0 });
    // state: 'ready' (mines not placed), 'play', 'won', 'lost'
    g = { w: L.w, h: L.h, n: L.n, cells: cells, state: 'ready', boom: -1, start: 0, secs: 0 };
  }
  if (!g) newGame();

  function neighbors(i) {
    var r = Math.floor(i / g.w), c = i % g.w, out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < g.h && nc >= 0 && nc < g.w) out.push(nr * g.w + nc);
    }
    return out;
  }

  function placeMines(safe) {
    var banned = {}, nb = neighbors(safe), pool = [], i;
    banned[safe] = 1;
    for (i = 0; i < nb.length; i++) banned[nb[i]] = 1;
    for (i = 0; i < g.cells.length; i++) if (!banned[i]) pool.push(i);
    KG.shuffle(pool);
    for (i = 0; i < g.n; i++) g.cells[pool[i]].m = 1;
    for (i = 0; i < g.cells.length; i++) {
      var ns = neighbors(i), k = 0;
      for (var j = 0; j < ns.length; j++) k += g.cells[ns[j]].m;
      g.cells[i].n = k;
    }
    g.state = 'play';
    g.start = new Date().getTime();
  }

  function open(i) {
    var stack = [i];
    while (stack.length) {
      var k = stack.pop(), cell = g.cells[k];
      if (cell.o || cell.f) continue;
      cell.o = 1;
      if (cell.m) { g.state = 'lost'; g.boom = k; return; }
      if (cell.n === 0) {
        var ns = neighbors(k);
        for (var j = 0; j < ns.length; j++) if (!g.cells[ns[j]].o) stack.push(ns[j]);
      }
    }
  }

  function checkWin() {
    for (var i = 0; i < g.cells.length; i++) if (!g.cells[i].m && !g.cells[i].o) return;
    g.state = 'won';
    for (i = 0; i < g.cells.length; i++) if (g.cells[i].m) g.cells[i].f = 1;
  }

  function tap(i) {
    if (g.state === 'won' || g.state === 'lost') return;
    var cell = g.cells[i];
    if (tool === 'f') {
      if (!cell.o && g.state === 'play') cell.f = cell.f ? 0 : 1;
    } else if (cell.o) {
      // chord: open neighbours of a number whose mines are all flagged
      var ns = neighbors(i), flags = 0, j;
      for (j = 0; j < ns.length; j++) flags += g.cells[ns[j]].f;
      if (cell.n > 0 && flags === cell.n) for (j = 0; j < ns.length; j++) open(ns[j]);
    } else if (!cell.f) {
      if (g.state === 'ready') placeMines(i);
      open(i);
    }
    if (g.state === 'play') checkWin();
    if (g.state === 'won' || g.state === 'lost') g.secs = Math.round((new Date().getTime() - g.start) / 1000);
    render();
  }

  function render() {
    var flags = 0, i;
    for (i = 0; i < g.cells.length; i++) flags += g.cells[i].f;
    var txt;
    if (g.state === 'won') txt = 'You win! Cleared in ' + g.secs + ' seconds.';
    else if (g.state === 'lost') txt = 'Boom! You hit a mine. Tap New Game to try again.';
    else txt = 'Mines: ' + g.n + '   Flags: ' + flags + '   Left: ' + (g.n - flags);
    KG.text(statusEl, txt);

    var w = Math.min((window.innerWidth || 600) - 24, (window.innerHeight || 800) - 280, 640);
    var S = Math.max(26, Math.floor(w / g.w) - 1), fs = Math.round(S * 0.55);
    var h = ['<table class="ms">'];
    for (i = 0; i < g.cells.length; i++) {
      var cell = g.cells[i], cls, label = '';
      if (i % g.w === 0) h.push('<tr>');
      var over = g.state === 'lost';
      if (over && cell.m && !cell.f) { cls = i === g.boom ? 'x' : 'o'; label = '*'; }
      else if (over && cell.f && !cell.m) { cls = 'w'; label = 'F'; }
      else if (cell.f) { cls = 'f'; label = 'F'; }
      else if (cell.o) { cls = 'o'; label = cell.n ? String(cell.n) : ''; }
      else cls = 'h';
      h.push('<td class="' + cls + '" data-sq="' + i + '" style="width:' + S + 'px;height:' + S + 'px;font-size:' + fs + 'px">' + label + '</td>');
      if (i % g.w === g.w - 1) h.push('</tr>');
    }
    h.push('</table>');
    boardEl.innerHTML = h.join('');
    KG.save(KEY, { level: level, g: g });
  }

  boardEl.onclick = function (e) {
    var v = KG.attrFromEvent(e, boardEl, 'data-sq');
    if (v !== null) tap(parseInt(v, 10));
  };
  KG.buttonGroup('levels', level, function (v) {
    if (g.state === 'play' && !window.confirm('Start a new game at this level?')) return false;
    level = v; newGame(); render();
  });
  KG.buttonGroup('tools', tool, function (v) { tool = v; });
  KG.$('newBtn').onclick = function () {
    if (g.state === 'play' && !window.confirm('Start a new game?')) return;
    newGame(); render();
  };
  window.onresize = render;
  render();
})();
</script>
</body>
</html>
