<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kindle Sudoku</title>
<link rel="stylesheet" href="style.css">
<style>
  .sd { border-collapse: collapse; margin: 0 auto; border: 3px solid #000; }
  .sd td { padding: 0; border: 1px solid #888; text-align: center; vertical-align: middle; font-family: Georgia, serif; }
  .sd td.br { border-right: 3px solid #000; }
  .sd td.bb { border-bottom: 3px solid #000; }
  .sd .giv { font-weight: bold; }
  .sd .usr { font-style: italic; }
  .sd .same { background: #ccc; }
  .sd .cur { background: #000; color: #fff; }
  .sd .bad { text-decoration: underline; background: #888; color: #fff; }
  .sd .notes { font-size: 11px; line-height: 12px; font-style: normal; }
  .pad { text-align: center; margin: 6px 0; }
  .pad button { width: 50px; height: 50px; font-size: 22px; font-weight: bold; margin: 2px; padding: 0; }
</style>
</head>
<body>
<div class="top"><a href="index.html">&larr; Home</a><span class="title">Sudoku</span></div>
<div class="controls" id="levels">
  <button data-v="e">Easy</button><button data-v="m">Medium</button><button data-v="h">Hard</button>
</div>
<div id="status" class="status"></div>
<div id="board"></div>
<div class="pad" id="pad">
  <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><br>
  <button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-n="0">&times;</button>
</div>
<div class="controls">
  <button id="notesBtn">Notes: off</button><button id="checkBtn">Check</button><button id="hintBtn">Hint</button><button id="undoBtn">Undo</button><button id="newBtn">New</button>
</div>
<p class="help">Fill every row, column and 3&times;3 box with 1&ndash;9. Tap a square, then a number (&times; clears it).
Turn <b>Notes</b> on to pencil in small candidate numbers. <b>Check</b> marks wrong numbers. Squares with the same number
as the selected one are shaded. Your puzzle is saved automatically.</p>
<script src="common.js"></script>
<script>
(function () {
  var KEY = 'kg-sudoku', CLUES = { e: 40, m: 32, h: 26 };
  var boardEl = KG.$('board'), statusEl = KG.$('status');
  var saved = KG.load(KEY) || {};
  var level = saved.level || 'e', g = saved.g || null, sel = -1, notes = false, bad = {}, msg = '';

  function box(i) { return Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor((i % 9) / 3); }
  // Counts solutions (up to limit). If out is given, the first solution is copied into it.
  function solve(grid, limit, randomize, out) {
    var g2 = grid.slice(), R = [], C = [], B = [], i, count = 0;
    for (i = 0; i < 9; i++) { R.push(0); C.push(0); B.push(0); }
    for (i = 0; i < 81; i++) if (g2[i]) { var bit = 1 << g2[i]; R[Math.floor(i / 9)] |= bit; C[i % 9] |= bit; B[box(i)] |= bit; }
    function rec() {
      var best = -1, bestMask = 0, bestN = 10, j;
      for (j = 0; j < 81; j++) {
        if (g2[j]) continue;
        var used = R[Math.floor(j / 9)] | C[j % 9] | B[box(j)], n = 0, m = 0;
        for (var d = 1; d <= 9; d++) if (!(used & (1 << d))) { n++; m |= 1 << d; }
        if (n < bestN) { bestN = n; best = j; bestMask = m; if (n <= 1) break; }
      }
      if (best < 0) { count++; if (out && count === 1) for (j = 0; j < 81; j++) out[j] = g2[j]; return count >= limit; }
      var ds = [];
      for (var d2 = 1; d2 <= 9; d2++) if (bestMask & (1 << d2)) ds.push(d2);
      if (randomize) KG.shuffle(ds);
      for (j = 0; j < ds.length; j++) {
        var b2 = 1 << ds[j], r = Math.floor(best / 9), c = best % 9, bx = box(best);
        g2[best] = ds[j]; R[r] |= b2; C[c] |= b2; B[bx] |= b2;
        if (rec()) return true;
        g2[best] = 0; R[r] &= ~b2; C[c] &= ~b2; B[bx] &= ~b2;
      }
      return false;
    }
    rec();
    return count;
  }

  function generate() {
    var empty = [], full = [], i;
    for (i = 0; i < 81; i++) { empty.push(0); full.push(0); }
    solve(empty, 1, true, full);
    var puzzle = full.slice(), order = [], clues = 81;
    for (i = 0; i < 81; i++) order.push(i);
    KG.shuffle(order);
    for (i = 0; i < 81 && clues > CLUES[level]; i++) {
      var p = order[i], keep = puzzle[p];
      puzzle[p] = 0;
      if (solve(puzzle, 2, false) !== 1) puzzle[p] = keep; else clues--;
    }
    var cells = [];
    for (i = 0; i < 81; i++) cells.push({ v: puzzle[i], giv: puzzle[i] ? 1 : 0, n: 0 });
    g = { cells: cells, sol: full, hist: [], done: false, start: new Date().getTime(), secs: 0, hints: 0 };
    sel = -1; bad = {}; msg = '';
  }

  function render() {
    var filled = 0, i, txt;
    for (i = 0; i < 81; i++) if (g.cells[i].v) filled++;
    if (g.done) txt = 'Solved in ' + Math.floor(g.secs / 60) + ':' + (g.secs % 60 < 10 ? '0' : '') + (g.secs % 60) + (g.hints ? ' (' + g.hints + ' hints)' : '') + '!';
    else txt = (81 - filled) + ' squares to fill' + (msg ? ' — ' + msg : '');
    KG.text(statusEl, txt);
    var W = Math.min((window.innerWidth || 600) - 24, (window.innerHeight || 800) - 330, 600);
    var S = Math.max(30, Math.floor(W / 9) - 1), fs = Math.round(S * 0.6);
    var selV = sel >= 0 ? g.cells[sel].v : 0, h = ['<table class="sd">'];
    for (i = 0; i < 81; i++) {
      var r = Math.floor(i / 9), c = i % 9, cell = g.cells[i], cls = [];
      if (i % 9 === 0) h.push('<tr>');
      if (c === 2 || c === 5) cls.push('br');
      if (r === 2 || r === 5) cls.push('bb');
      cls.push(cell.giv ? 'giv' : 'usr');
      if (i === sel) cls.push('cur');
      else if (bad[i]) cls.push('bad');
      else if (selV && cell.v === selV) cls.push('same');
      var inner = '';
      if (cell.v) inner = String(cell.v);
      else if (cell.n) {
        var t = [];
        for (var d = 1; d <= 9; d++) t.push(cell.n & (1 << d) ? d : '&nbsp;');
        inner = '<div class="notes" style="font-size:' + Math.round(S * 0.26) + 'px;line-height:' + Math.round(S * 0.3) + 'px">' +
          t.slice(0, 3).join(' ') + '<br>' + t.slice(3, 6).join(' ') + '<br>' + t.slice(6).join(' ') + '</div>';
      }
      h.push('<td data-sq="' + i + '" class="' + cls.join(' ') + '" style="width:' + S + 'px;height:' + S + 'px;font-size:' + fs + 'px">' + inner + '</td>');
      if (i % 9 === 8) h.push('</tr>');
    }
    h.push('</table>');
    boardEl.innerHTML = h.join('');
    KG.save(KEY, { level: level, g: g });
  }

  function checkDone() {
    for (var i = 0; i < 81; i++) if (g.cells[i].v !== g.sol[i]) return;
    g.done = true; sel = -1;
    g.secs = Math.round((new Date().getTime() - g.start) / 1000);
  }
  function setCell(i, n) {
    var cell = g.cells[i];
    if (cell.giv || g.done) return;
    g.hist.push({ i: i, v: cell.v, n: cell.n });
    if (g.hist.length > 200) g.hist.shift();
    if (n === 0) { cell.v = 0; cell.n = 0; }
    else if (notes) { cell.v = 0; cell.n ^= 1 << n; }
    else {
      cell.v = cell.v === n ? 0 : n;
      if (cell.v) {
        // Clear this number from notes in the same row, column and box.
        for (var j = 0; j < 81; j++) {
          if (Math.floor(j / 9) === Math.floor(i / 9) || j % 9 === i % 9 || box(j) === box(i)) g.cells[j].n &= ~(1 << n);
        }
      }
    }
    delete bad[i];
    msg = '';
    checkDone();
    render();
  }

  boardEl.onclick = function (e) {
    var v = KG.attrFromEvent(e, boardEl, 'data-sq');
    if (v === null || g.done) return;
    sel = parseInt(v, 10);
    render();
  };
  KG.$('pad').onclick = function (e) {
    var n = KG.attrFromEvent(e, KG.$('pad'), 'data-n');
    if (n === null) return;
    if (sel < 0) { msg = 'tap a square first'; render(); return; }
    setCell(sel, parseInt(n, 10));
  };
  KG.$('notesBtn').onclick = function () {
    notes = !notes;
    KG.text(KG.$('notesBtn'), 'Notes: ' + (notes ? 'on' : 'off'));
    KG.$('notesBtn').className = notes ? 'on' : '';
  };
  KG.$('checkBtn').onclick = function () {
    bad = {}; var n = 0;
    for (var i = 0; i < 81; i++) if (g.cells[i].v && g.cells[i].v !== g.sol[i]) { bad[i] = 1; n++; }
    msg = n ? n + ' wrong' : 'no mistakes so far';
    render();
  };
  KG.$('hintBtn').onclick = function () {
    if (g.done) return;
    var p = sel >= 0 && g.cells[sel].v !== g.sol[sel] ? sel : -1, i;
    if (p < 0) for (i = 0; i < 81; i++) if (g.cells[i].v !== g.sol[i]) { p = i; break; }
    if (p < 0) return;
    g.hints++;
    var keep = notes; notes = false;
    sel = p;
    setCell(p, g.sol[p]);
    notes = keep;
  };
  KG.$('undoBtn').onclick = function () {
    if (!g.hist.length || g.done) return;
    var h = g.hist.pop();
    g.cells[h.i].v = h.v; g.cells[h.i].n = h.n;
    sel = h.i; render();
  };
  function fresh() {
    KG.text(statusEl, 'Making a new puzzle…');
    setTimeout(function () { generate(); render(); }, 50);
  }
  KG.$('newBtn').onclick = function () {
    if (!g.done && g.hist.length && !window.confirm('Start a new puzzle?')) return;
    fresh();
  };
  KG.buttonGroup('levels', level, function (v) {
    if (!g.done && g.hist.length && !window.confirm('Start a new puzzle at this level?')) return false;
    level = v; fresh();
  });
  window.onresize = render;
  if (g) render(); else fresh();
})();
</script>
</body>
</html>
