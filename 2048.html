<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kindle 2048</title>
<link rel="stylesheet" href="style.css">
<style>
  .pad { text-align: center; margin: 6px 0; }
  .pad button { width: 90px; height: 64px; font-size: 26px; font-weight: bold; }
  .pad .mid { display: inline-block; width: 90px; }
  .t48 { border-collapse: separate; border-spacing: 5px; background: #000; margin: 0 auto; }
  .t48 td { text-align: center; vertical-align: middle; font-weight: bold; padding: 0; }
</style>
</head>
<body>
<div class="top"><a href="index.html">&larr; Games</a><span class="title">2048</span></div>
<div id="status" class="status"></div>
<div id="board"></div>
<div class="pad">
  <button id="up">&uarr;</button><br>
  <button id="left">&larr;</button><span class="mid"></span><button id="right">&rarr;</button><br>
  <button id="down">&darr;</button>
</div>
<div class="controls">
  <button id="newBtn">New Game</button>
  <button id="undoBtn">Undo</button>
</div>
<p class="help">Use the arrow buttons (or swipe on the board) to slide all tiles. Equal tiles merge. Reach 2048!
Your game is saved automatically.</p>
<script src="common.js"></script>
<script>
(function () {
  var KEY = 'kg-2048';
  var saved = KG.load(KEY) || {};
  var g = saved.g || null, best = saved.best || 0, prev = saved.prev || null;
  var boardEl = KG.$('board'), statusEl = KG.$('status');

  function empty() { var c = []; for (var i = 0; i < 16; i++) c.push(0); return c; }
  function addTile(cells) {
    var free = [];
    for (var i = 0; i < 16; i++) if (!cells[i]) free.push(i);
    if (free.length) cells[free[Math.floor(Math.random() * free.length)]] = Math.random() < 0.9 ? 2 : 4;
  }
  function newGame() {
    g = { cells: empty(), score: 0, won: false, keepGoing: false };
    addTile(g.cells); addTile(g.cells);
    prev = null;
  }
  if (!g) newGame();

  // dir: 0 up, 1 right, 2 down, 3 left. Returns {cells, gained, moved}.
  function slide(cells, dir) {
    var out = cells.slice(), gained = 0, moved = false;
    for (var line = 0; line < 4; line++) {
      var idx = [];
      for (var k = 0; k < 4; k++) {
        if (dir === 0) idx.push(k * 4 + line);
        else if (dir === 2) idx.push((3 - k) * 4 + line);
        else if (dir === 3) idx.push(line * 4 + k);
        else idx.push(line * 4 + 3 - k);
      }
      var vals = [], res = [], j;
      for (j = 0; j < 4; j++) if (out[idx[j]]) vals.push(out[idx[j]]);
      for (j = 0; j < vals.length; j++) {
        if (j + 1 < vals.length && vals[j] === vals[j + 1]) { res.push(vals[j] * 2); gained += vals[j] * 2; j++; }
        else res.push(vals[j]);
      }
      while (res.length < 4) res.push(0);
      for (j = 0; j < 4; j++) { if (out[idx[j]] !== res[j]) moved = true; out[idx[j]] = res[j]; }
    }
    return { cells: out, gained: gained, moved: moved };
  }
  function canMove(cells) {
    for (var d = 0; d < 4; d++) if (slide(cells, d).moved) return true;
    return false;
  }

  function move(dir) {
    var r = slide(g.cells, dir);
    if (!r.moved) return;
    prev = { cells: g.cells, score: g.score, won: g.won, keepGoing: g.keepGoing };
    g.cells = r.cells;
    g.score += r.gained;
    addTile(g.cells);
    if (g.score > best) best = g.score;
    for (var i = 0; i < 16; i++) if (g.cells[i] >= 2048) g.won = true;
    render();
  }

  function render() {
    var over = !canMove(g.cells);
    var txt = 'Score: ' + g.score + '   Best: ' + best;
    if (over) txt += ' — Game over!';
    else if (g.won && !g.keepGoing) { txt += ' — You made 2048!'; g.keepGoing = true; }
    KG.text(statusEl, txt);

    var w = Math.min((window.innerWidth || 600) - 24, (window.innerHeight || 800) - 400, 520);
    var cell = Math.floor((Math.max(200, w) - 25) / 4);
    var h = ['<table class="t48">'];
    for (var i = 0; i < 16; i++) {
      var v = g.cells[i];
      var lvl = v ? Math.round(Math.log(v) / Math.LN2) : 0;
      var bg = !v ? '#999' : (lvl <= 2 ? '#fff' : (lvl <= 4 ? '#ddd' : (lvl <= 6 ? '#bbb' : (lvl <= 8 ? '#555' : '#222'))));
      var digits = String(v).length;
      var fs = Math.floor(cell * (digits <= 2 ? 0.5 : digits === 3 ? 0.4 : 0.3));
      if (i % 4 === 0) h.push('<tr>');
      h.push('<td style="width:' + cell + 'px;height:' + cell + 'px;background:' + bg + ';color:' + (lvl <= 6 ? '#000' : '#fff') +
        ';font-size:' + fs + 'px">' + (v ? v : '') + '</td>');
      if (i % 4 === 3) h.push('</tr>');
    }
    h.push('</table>');
    boardEl.innerHTML = h.join('');
    KG.save(KEY, { g: g, best: best, prev: prev });
  }

  KG.$('up').onclick = function () { move(0); };
  KG.$('right').onclick = function () { move(1); };
  KG.$('down').onclick = function () { move(2); };
  KG.$('left').onclick = function () { move(3); };
  KG.$('newBtn').onclick = function () {
    if (canMove(g.cells) && g.score > 0 && !window.confirm('Start a new game?')) return;
    newGame(); render();
  };
  KG.$('undoBtn').onclick = function () {
    if (!prev) return;
    g = prev; prev = null; render();
  };
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode, map = { 38: 0, 39: 1, 40: 2, 37: 3 };
    if (map[k] !== undefined) { move(map[k]); if (e.preventDefault) e.preventDefault(); return false; }
  };
  var sx = null, sy = null;
  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    e.preventDefault();
  }, false);
  boardEl.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3); else move(dy > 0 ? 2 : 0);
  }, false);
  window.onresize = render;
  render();
})();
</script>
</body>
</html>
